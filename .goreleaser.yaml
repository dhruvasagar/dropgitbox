# Release configuration. Build locally with:
#   goreleaser release --snapshot --clean
# Releases are cut with scripts/release.sh, which pushes an annotated v* tag;
# .github/workflows/release.yml then publishes it.
version: 2

project_name: dropgitbox

before:
  hooks:
    - go mod tidy
    # Man pages and shell completion scripts, generated from the commands.
    # (Tests run in CI, which the release workflow runs before publishing.)
    - go run ./internal/gendocs -version {{ .Version }} -date {{ .CommitDate }} build/docs

builds:
  - id: dropgitbox
    main: ./cmd/dropgitbox
    binary: dropgitbox
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - docs/*
      - packaging/**/*
      - src: build/docs/man/*
        dst: man
        strip_parent: true
      - src: build/docs/completions/*
        dst: completions
        strip_parent: true

checksum:
  name_template: checksums.txt

nfpms:
  - id: packages
    package_name: dropgitbox
    file_name_template: "{{ .ConventionalFileName }}"
    homepage: https://github.com/dhruvasagar/dropgitbox
    maintainer: Dhruva Sagar
    description: |-
      Dropbox-like folder sync backed by git.
      Every change is auto-committed before it is synced, so the full history
      of every file is kept. One binary provides the server and the client.
    license: MIT
    section: net
    formats: [deb, rpm]
    bindir: /usr/bin
    dependencies:
      - git
    contents:
      - src: packaging/systemd/dropgitbox-server.service
        dst: /usr/lib/systemd/system/dropgitbox-server.service
      - src: packaging/systemd/dropgitbox.service
        dst: /usr/lib/systemd/user/dropgitbox.service
      - src: packaging/config.server.toml
        dst: /etc/dropgitbox/config.toml
        type: config|noreplace
        file_info:
          mode: 0644
      - src: packaging/config.example.toml
        dst: /usr/share/doc/dropgitbox/config.example.toml
      - src: docs/*.md
        dst: /usr/share/doc/dropgitbox/
      - src: LICENSE
        dst: /usr/share/doc/dropgitbox/copyright
      - src: build/docs/man/*
        dst: /usr/share/man/man1/
      - src: build/docs/completions/dropgitbox.bash
        dst: /usr/share/bash-completion/completions/dropgitbox
      - src: build/docs/completions/_dropgitbox
        dst: /usr/share/zsh/vendor-completions/_dropgitbox
        packager: deb
      - src: build/docs/completions/_dropgitbox
        dst: /usr/share/zsh/site-functions/_dropgitbox
        packager: rpm
      - src: build/docs/completions/dropgitbox.fish
        dst: /usr/share/fish/vendor_completions.d/dropgitbox.fish
    scripts:
      postinstall: packaging/scripts/postinstall.sh
      preremove: packaging/scripts/preremove.sh

release:
  github:
    owner: dhruvasagar
    name: dropgitbox
  name_template: "{{ .ProjectName }} {{ .Tag }}"
  # v1.2.0-rc.1 and the like are marked as prereleases.
  prerelease: auto
  # The release notes are the annotated tag's message (minus its subject
  # line), written with scripts/release.sh.
  header: |
    {{ .TagBody }}
  footer: |
    ## Install

    ```sh
    curl -fsSL https://raw.githubusercontent.com/dhruvasagar/dropgitbox/main/install.sh | sh
    ```

    or download a `.deb` / `.rpm` / archive below. See the
    [README](https://github.com/dhruvasagar/dropgitbox#readme) to set up a server and devices.

changelog:
  # The notes come from the tag message instead (see release.header).
  disable: true
