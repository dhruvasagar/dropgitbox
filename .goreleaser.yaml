# Release configuration. Build locally with:
#   goreleaser release --snapshot --clean
# Releases are published by .github/workflows/release.yml on a v* tag.
version: 2

project_name: dropgitbox

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: dropgitbox
    main: ./cmd/dropgitbox
    binary: dropgitbox
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - docs/*
      - packaging/**/*

checksum:
  name_template: checksums.txt

nfpms:
  - id: packages
    package_name: dropgitbox
    file_name_template: "{{ .ConventionalFileName }}"
    homepage: https://github.com/dhruvasagar/dropgitbox
    maintainer: Dhruva Sagar
    description: |-
      Dropbox-like folder sync backed by git.
      Every change is auto-committed before it is synced, so the full history
      of every file is kept. One binary provides the server and the client.
    license: MIT
    section: net
    formats: [deb, rpm]
    bindir: /usr/bin
    dependencies:
      - git
    contents:
      - src: packaging/systemd/dropgitbox-server.service
        dst: /usr/lib/systemd/system/dropgitbox-server.service
      - src: packaging/systemd/dropgitbox.service
        dst: /usr/lib/systemd/user/dropgitbox.service
      - src: packaging/config.server.toml
        dst: /etc/dropgitbox/config.toml
        type: config|noreplace
        file_info:
          mode: 0644
      - src: packaging/config.example.toml
        dst: /usr/share/doc/dropgitbox/config.example.toml
      - src: docs/deployment.md
        dst: /usr/share/doc/dropgitbox/deployment.md
      - src: LICENSE
        dst: /usr/share/doc/dropgitbox/copyright
    scripts:
      postinstall: packaging/scripts/postinstall.sh
      preremove: packaging/scripts/preremove.sh

release:
  github:
    owner: dhruvasagar
    name: dropgitbox
  footer: |
    ## Install

    ```sh
    curl -fsSL https://raw.githubusercontent.com/dhruvasagar/dropgitbox/main/install.sh | sh
    ```

    or download a `.deb` / `.rpm` / archive below. See the
    [README](https://github.com/dhruvasagar/dropgitbox#readme) to set up a server and devices.

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
